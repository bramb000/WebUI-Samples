name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_SITE_URL: https://bramha.work
      VITE_POSTHOG_KEY: phc_nPKGlNSyr9gpzBWzOCCPiRzhzQzAAo00ASWlZ51nlRC
      VITE_POSTHOG_HOST: https://us.i.posthog.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright (prerender)
        run: npx playwright install chromium --with-deps

      - name: Prepare SEO assets
        run: node scripts/prepare-seo-assets.mjs

      - name: Typecheck
        run: npx vue-tsc -b

      - name: Build app
        run: npx vite build

      - name: Prerender routes
        run: node scripts/prerender.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: SEO smoke test
        run: node scripts/seo-smoke-test.mjs

      - run: cp build/index.html build/404.html

      - run: npm run build-storybook

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

      - id: deployment
        uses: actions/deploy-pages@v4
